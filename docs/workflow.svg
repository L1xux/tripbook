<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B9B1A2"/>
    </marker>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E4531F"/>
    </marker>
  </defs>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
    <rect width="980" height="470" fill="#F7F4EE"/>

    <text x="34" y="44" font-size="18" font-weight="700" fill="#191610">Tripbook 워크플로우</text>
    <text x="34" y="67" font-size="12.5" fill="#8C8578">여행 중에 순간을 담고, 여행이 끝나면 한 권의 책으로 만들어 나와 동행자에게 보냅니다.</text>
    <line x1="34" y1="90" x2="946" y2="90" stroke="#E7E1D6" stroke-width="1"/>

    <text x="34" y="121" font-size="12.5" font-weight="700" fill="#8C8578" letter-spacing="0.5">사용자가 하는 일</text>

    <rect x="34" y="138" width="196" height="78" rx="14" fill="#FFFFFF" stroke="#E7E1D6" stroke-width="1.5"/>
    <text x="52" y="165" font-size="11" font-weight="700" fill="#E4531F" letter-spacing="0.8">01</text>
    <text x="52" y="187" font-size="14.5" font-weight="700" fill="#191610">여행을 시작한다</text>
    <text x="52" y="206" font-size="11.5" fill="#8C8578">제목과 동행자를 적는다</text>

    <line x1="238" y1="177" x2="272" y2="177" stroke="#B9B1A2" stroke-width="1.5" marker-end="url(#a)"/>

    <rect x="280" y="138" width="236" height="78" rx="14" fill="#FFFFFF" stroke="#E7E1D6" stroke-width="1.5"/>
    <text x="298" y="165" font-size="11" font-weight="700" fill="#E4531F" letter-spacing="0.8">02</text>
    <text x="298" y="187" font-size="14.5" font-weight="700" fill="#191610">순간을 담는다</text>
    <text x="298" y="206" font-size="11.5" fill="#8C8578">사진을 찍고 목소리로 한 마디 남긴다</text>

    <line x1="524" y1="177" x2="558" y2="177" stroke="#B9B1A2" stroke-width="1.5" marker-end="url(#a)"/>

    <rect x="566" y="138" width="188" height="78" rx="14" fill="#FFFFFF" stroke="#E7E1D6" stroke-width="1.5"/>
    <text x="584" y="165" font-size="11" font-weight="700" fill="#E4531F" letter-spacing="0.8">03</text>
    <text x="584" y="187" font-size="14.5" font-weight="700" fill="#191610">앨범을 넘겨본다</text>
    <text x="584" y="206" font-size="11.5" fill="#8C8578">글귀와 목소리가 담긴 카드</text>

    <line x1="762" y1="177" x2="796" y2="177" stroke="#B9B1A2" stroke-width="1.5" marker-end="url(#a)"/>

    <rect x="804" y="138" width="142" height="78" rx="14" fill="#FFFFFF" stroke="#E7E1D6" stroke-width="1.5"/>
    <text x="822" y="165" font-size="11" font-weight="700" fill="#E4531F" letter-spacing="0.8">04</text>
    <text x="822" y="187" font-size="14.5" font-weight="700" fill="#191610">책으로 만든다</text>
    <text x="822" y="206" font-size="11.5" fill="#8C8578">나와 동행자에게</text>

    <line x1="34" y1="252" x2="946" y2="252" stroke="#E7E1D6" stroke-width="1"/>
    <text x="34" y="283" font-size="12.5" font-weight="700" fill="#8C8578" letter-spacing="0.5">뒤에서 일어나는 일</text>

    <line x1="398" y1="220" x2="398" y2="296" stroke="#E4531F" stroke-width="1.5" marker-end="url(#s)"/>
    <rect x="280" y="300" width="236" height="90" rx="14" fill="#FBE9E0" stroke="#F0CDBB" stroke-width="1.5"/>
    <text x="298" y="327" font-size="14" font-weight="700" fill="#191610">말한 그대로 글귀가 된다</text>
    <text x="298" y="348" font-size="11.5" fill="#8C8578">Whisper가 받아쓴 뒤 말투를 살려 다듬는다</text>
    <text x="298" y="367" font-size="11.5" fill="#8C8578">없는 말은 쓰지 않는다</text>

    <line x1="875" y1="220" x2="875" y2="296" stroke="#E4531F" stroke-width="1.5" marker-end="url(#s)"/>
    <rect x="566" y="300" width="380" height="90" rx="14" fill="#FBE9E0" stroke="#F0CDBB" stroke-width="1.5"/>
    <text x="584" y="327" font-size="14" font-weight="700" fill="#191610">Sweetbook Book Print API</text>
    <text x="584" y="348" font-size="11.5" fill="#8C8578">표지와 내지를 조립해 책을 최종화하고 잔액을 확인한 뒤</text>
    <text x="584" y="367" font-size="11.5" fill="#8C8578">사람마다 한 권씩 주문한다. 상태는 웹훅으로 받는다</text>

    <line x1="34" y1="414" x2="946" y2="414" stroke="#E7E1D6" stroke-width="1"/>
    <circle cx="42" cy="443" r="5" fill="#E4531F"/>
    <text x="58" y="448" font-size="14" font-weight="700" fill="#191610">책이 도착하면 인쇄된 QR을 스캔해 그때의 목소리를 다시 듣는다</text>
  </g>
</svg>
